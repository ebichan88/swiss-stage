plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.8.0'
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.swiss_stage'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Spring Bootが内部的に管理するjunit-platform-launcherのバージョンが1.14.2のまま
// junit-jupiter(6.0.3)側に追随しておらず、全テストエンジンがNoSuchMethodErrorで
// 起動失敗する(実測)。通常のdependencies{}宣言・resolutionStrategy.force・
// dependencyManagement DSLのいずれでも上書きされず、resolutionStrategy.eachDependency
// による明示的な書き換えでのみ効果があった。
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.junit.platform'
            && details.requested.name == 'junit-platform-launcher') {
            details.useVersion('6.0.3')
            details.because('junit-jupiter 6.0.3との組み合わせに必要(実測でNoSuchMethodError)')
        }
    }
}

// Spring Bootプラグインが自動付与する -parameters はVSCode(Eclipse JDT)のビルドに
// 伝わらないため明示する(省略時、名前なし @PathVariable の解決が実行時に失敗する)
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

dependencies {
    // Spring Boot 4のモジュール分割でartifact名が変わった(01_architecture_design.md、
    // 06_adr/02_spring_boot_4_upgrade.md)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Google OAuth2ログイン(13_security_design.md §2。セッションJWTは自前のjjwtで発行)
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

    // IPベースの簡易レート制限(13_security_design.md §5。共有トークンのブルートフォース対策)
    implementation 'com.bucket4j:bucket4j-core:8.10.1'

    // 共有ページ集約のインメモリキャッシュ(14_performance_optimization.md §3)
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.0'

    // DynamoDB (AWS SDK for Java v2 Enhanced Client)
    implementation platform('software.amazon.awssdk:bom:2.42.26')
    implementation 'software.amazon.awssdk:dynamodb-enhanced'

    // ULID生成(純Javaライブラリ。domain層での使用可)
    implementation 'com.github.f4b6a3:ulid-creator:5.2.3'

    // JWT(運営者セッションCookie)。jjwt-jacksonはJackson 2依存でSpring Boot 4のJackson 3と
    // 競合するため、GSON実装(jjwt-gson)に差し替える(06_adr/02_spring_boot_4_upgrade.md)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.12.7'

    // 構造化ログ(JSON。06_error_handling_design.md §3)。9.0以降でJackson 3に対応
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Spring Boot 4のテスト基盤モジュール分割に伴い明示追加(06_adr/02_spring_boot_4_upgrade.md)。
    // starterごとに対応するtest starterが用意されており、MockMvcは
    // spring-boot-starter-webmvc-testが提供する
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // TestRestTemplateはspring-boot-resttestclientが提供する。restclientへの実行時依存は
    // 自動で付随しないため明示する(spring-boot#48588)
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testRuntimeOnly 'org.springframework.boot:spring-boot-restclient'
    testImplementation 'net.jqwik:jqwik:1.9.2'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
    // contractテストのOpenAPIスキーマ検証(schema/openapi.yaml がAPI契約のSSoT)
    testImplementation 'com.atlassian.oai:swagger-request-validator-mockmvc:2.44.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// schema/openapi.yaml をテストのclasspathに載せる(contractテストのスキーマ検証用)
sourceSets {
    test {
        resources {
            srcDir '../schema'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    // -Dcharacterization.update=true はGradle自身のJVMに渡るだけで、testはデフォルトで
    // フォークした別JVMで動くため自動転送されない(CharacterizationTest用)。明示的に転送する
    systemProperty 'characterization.update', System.getProperty('characterization.update')
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// domain層(マッチング・順位計算)はカバレッジ90%以上を強制(09_test_strategy.md)。
// LINEは「実行したか」しか測らずアサーションが空でも達成できるため、BRANCHも
// 強制する(「分岐を網羅したか」を見る)。
//
// BRANCHの閾値はパッケージごとに実測値(2026-07-30時点)を実質下回らない水準で固定した
// (element='PACKAGE'はパッケージ単位で個別に評価されるため、合算値ではなくパッケージ
// ごとの最小値を見る必要がある。domain.model 83.23% / domain.service 92.68% と差が
// あった)。テスト順序等の微小な揺らぎを吸収する余裕を持たせつつ回帰は検知できる
// (いきなり両方0.90にはしない。開発プロセス自動化 PR4)。
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'PACKAGE'
            includes = ['com.swiss_stage.domain.model', 'com.swiss_stage.domain.service']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
        rule {
            element = 'PACKAGE'
            includes = ['com.swiss_stage.domain.model']
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
        rule {
            element = 'PACKAGE'
            includes = ['com.swiss_stage.domain.service']
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

// Mutation Testing(PITest)。カバレッジが「実行したか」しか測らないのに対し、
// 「コードを壊したらテストが気づくか」を測る。domain層のみに絞り、checkには
// 紐付けない(PR CIが大幅に遅くなるため。e2e.yml/vrt.ymlと同じ「重いものは別
// ワークフロー」方針。開発プロセス自動化 PR4)。実行は .github/workflows/mutation.yml
// (workflow_dispatch + 週次schedule)から行う。
//
// mutationThresholdは設定しない。初回は実測値を見てから次PRで閾値を固定する。
pitest {
    targetClasses = ['com.swiss_stage.domain.*']
    // targetTestsの既定値はtargetClassesと同じパターンだが、domainのテストは
    // com.swiss_stage.unit.domain 配下にあり com.swiss_stage.domain 直下ではないため
    // 明示しないと「対象テストが0件」でNO_COVERAGE(0%)になる(実際に踏んだ)
    targetTests = ['com.swiss_stage.unit.domain.*']
    junit5PluginVersion = '1.2.1'
    timestampedReports = false
}

// コードフォーマット(Google Java Style)・未使用import・import順の自動検査(checkに自動的に含まれる)
spotless {
    java {
        googleJavaFormat('1.27.0')
        // static importを第1グループ、それ以外をASCII辞書順の1グループとする
        importOrder('\\#', '')
        removeUnusedImports()
    }
}
