plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.8.0'
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.swiss_stage'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// コンパイル・テスト実行はJDK 25(toolchain)で行うが、生成するバイトコードはJava 21相当に
// 留める(release)。Spring Boot 3.4.1(Spring Framework 6.2系)のクラスパススキャン(ASMベースの
// SimpleMetadataReader)はJava 25のクラスファイル形式(major version 69)をまだ認識できず、
// ClassFormatExceptionで全@SpringBootTestが起動失敗する(実測)。Spring Boot 4系への
// 移行(#103, `06_adr/02_spring_boot_4_upgrade.md`)まではreleaseを21に固定する
// (決定の経緯は `06_adr/03_java25_bytecode_release_pin.md`)。
//
// Spring Bootプラグインが自動付与する -parameters はVSCode(Eclipse JDT)のビルドに
// 伝わらないため明示する(省略時、名前なし @PathVariable の解決が実行時に失敗する)
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs << '-parameters'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Google OAuth2ログイン(13_security_design.md §2。セッションJWTは自前のjjwtで発行)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // IPベースの簡易レート制限(13_security_design.md §5。共有トークンのブルートフォース対策)
    implementation 'com.bucket4j:bucket4j-core:8.10.1'

    // 共有ページ集約のインメモリキャッシュ(14_performance_optimization.md §3)
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.0'

    // DynamoDB (AWS SDK for Java v2 Enhanced Client)
    // 注: spring-data-dynamodb(boostchicken)は Spring Boot 3 非対応のため使用しない
    implementation platform('software.amazon.awssdk:bom:2.29.45')
    implementation 'software.amazon.awssdk:dynamodb-enhanced'

    // ULID生成(純Javaライブラリ。domain層での使用可)
    implementation 'com.github.f4b6a3:ulid-creator:5.2.3'

    // JWT(運営者セッションCookie。Google OAuth2はPhase 5で追加)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // 構造化ログ(JSON。06_error_handling_design.md §3)
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'net.jqwik:jqwik:1.9.2'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    // contractテストのOpenAPIスキーマ検証(schema/openapi.yaml がAPI契約のSSoT)
    testImplementation 'com.atlassian.oai:swagger-request-validator-mockmvc:2.44.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// schema/openapi.yaml をテストのclasspathに載せる(contractテストのスキーマ検証用)
sourceSets {
    test {
        resources {
            srcDir '../schema'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    // -Dcharacterization.update=true はGradle自身のJVMに渡るだけで、testはデフォルトで
    // フォークした別JVMで動くため自動転送されない(CharacterizationTest用)。明示的に転送する
    systemProperty 'characterization.update', System.getProperty('characterization.update')
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// domain層(マッチング・順位計算)はカバレッジ90%以上を強制(09_test_strategy.md)。
// LINEは「実行したか」しか測らずアサーションが空でも達成できるため、BRANCHも
// 強制する(「分岐を網羅したか」を見る)。
//
// BRANCHの閾値はパッケージごとに実測値(2026-07-30時点)を実質下回らない水準で固定した
// (element='PACKAGE'はパッケージ単位で個別に評価されるため、合算値ではなくパッケージ
// ごとの最小値を見る必要がある。domain.model 83.23% / domain.service 92.68% と差が
// あった)。テスト順序等の微小な揺らぎを吸収する余裕を持たせつつ回帰は検知できる
// (いきなり両方0.90にはしない。開発プロセス自動化 PR4)。
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'PACKAGE'
            includes = ['com.swiss_stage.domain.model', 'com.swiss_stage.domain.service']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
        rule {
            element = 'PACKAGE'
            includes = ['com.swiss_stage.domain.model']
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
        rule {
            element = 'PACKAGE'
            includes = ['com.swiss_stage.domain.service']
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

// Mutation Testing(PITest)。カバレッジが「実行したか」しか測らないのに対し、
// 「コードを壊したらテストが気づくか」を測る。domain層のみに絞り、checkには
// 紐付けない(PR CIが大幅に遅くなるため。e2e.yml/vrt.ymlと同じ「重いものは別
// ワークフロー」方針。開発プロセス自動化 PR4)。実行は .github/workflows/mutation.yml
// (workflow_dispatch + 週次schedule)から行う。
//
// mutationThresholdは設定しない。初回は実測値を見てから次PRで閾値を固定する。
pitest {
    targetClasses = ['com.swiss_stage.domain.*']
    // targetTestsの既定値はtargetClassesと同じパターンだが、domainのテストは
    // com.swiss_stage.unit.domain 配下にあり com.swiss_stage.domain 直下ではないため
    // 明示しないと「対象テストが0件」でNO_COVERAGE(0%)になる(実際に踏んだ)
    targetTests = ['com.swiss_stage.unit.domain.*']
    junit5PluginVersion = '1.2.1'
    timestampedReports = false
}

// コードフォーマット(Google Java Style)・未使用import・import順の自動検査(checkに自動的に含まれる)
spotless {
    java {
        googleJavaFormat('1.27.0')
        // static importを第1グループ、それ以外をASCII辞書順の1グループとする
        importOrder('\\#', '')
        removeUnusedImports()
    }
}
