name: CI
on:
  pull_request:
  push:
    branches: [main]
  # AI Fixerの修正コミットがイベントを発火しない場合に ai-review.yml から起動する
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # カバレッジレポートのPRコメント投稿用

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: OpenAPIスキーマのlint(API契約のSSoT)
        run: pnpm --package=@redocly/cli@1 dlx redocly lint ../schema/openapi.yaml
      - name: 生成型の鮮度チェック(schema変更にgenerate:apiが追随しているか)
        run: |
          pnpm run generate:api
          git diff --exit-code src/types/generated/
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run type-check
      - run: pnpm run test:coverage
      - name: Add coverage report to PR
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: frontend
      - run: pnpm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Create DynamoDB Local table
        run: ./scripts/create-table.sh
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
      - run: ./gradlew check build
      - name: Add coverage report to PR
        if: always() && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/backend/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Backend Code Coverage
          update-comment: true
          min-coverage-overall: 0
          min-coverage-changed-lines: 0

  # CI失敗のうち「コマンド一発で決定論的に直るもの」だけを自動修正してpushする。
  # AIは使わない(エージェント課金ゼロ・数十秒)。判断を要する失敗(型エラー・
  # テスト失敗・カバレッジ不足)は対象外で、人間またはci-fixerが扱う(11_cicd_design.md §2.7)
  autofix:
    needs: [frontend, backend]
    if: ${{ failure() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # 修正コミットのpush(AUTOFIX_TOKEN未設定時のフォールバック用)
      pull-requests: write # PRコメント
    steps:
      - uses: actions/checkout@v4
        with:
          # merge refではなくPRブランチ実体をcheckoutする(pushするため)
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # AUTOFIX_TOKEN(人間名義のPAT)でpushする。GITHUB_TOKENでpushすると
          # (1) 後続のpull_request実行が action_required で手動承認待ちになり、
          # (2) actorが github-actions[bot] になるため allowed_bots に弾かれて
          # AIレビュー・QAがハード失敗する。実測で確認済み(§2.7)
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}
          persist-credentials: true

      - name: 実行要否を判定
        id: decide
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE" -q

          # AUTOFIX_TOKENが未設定なら自動pushしない(bot pushの副作用を避けるため)
          if [ -z "${AUTOFIX_TOKEN}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "token_missing=true" >> "$GITHUB_OUTPUT"
            echo "AUTOFIX_TOKEN が未設定のため自動修正を行いません(セットアップ手順は 11_cicd_design.md §2.7)"
            exit 0
          fi
          echo "token_missing=false" >> "$GITHUB_OUTPUT"

          # ループ防止: 決定論的な修正は1回で収束するはずなので、既に [ci-fix] が
          # 積まれているのに失敗しているなら、それは自動修正で直る種類の失敗ではない。
          # `git log --grep` は本文も検索してしまうため subject だけを対象にする
          # (ai-review.yml のゲートと同じ理由)
          CI_FIX_COUNT=$(git log "origin/$BASE..HEAD" --format='%H%x09%s' \
            | grep -cE $'^[0-9a-f]+\t.*\\[ci-fix\\]' || true)
          echo "既存の[ci-fix]コミット数: $CI_FIX_COUNT"

          if [ "$CI_FIX_COUNT" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "既に自動修正済みのため実行しません(決定論的な修正は1回で収束する)"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # ---- frontendが失敗した場合のみ ----
      - uses: pnpm/action-setup@v4
        if: steps.decide.outputs.run == 'true' && needs.frontend.result == 'failure'
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        if: steps.decide.outputs.run == 'true' && needs.frontend.result == 'failure'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: frontendの決定論的修正(prettier / 生成型の再生成)
        if: steps.decide.outputs.run == 'true' && needs.frontend.result == 'failure'
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run format
          pnpm run generate:api

      # ---- backendが失敗した場合のみ ----
      - uses: actions/setup-java@v4
        if: steps.decide.outputs.run == 'true' && needs.backend.result == 'failure'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: backendの決定論的修正(Spotless)
        if: steps.decide.outputs.run == 'true' && needs.backend.result == 'failure'
        working-directory: backend
        run: ./gradlew spotlessApply

      # ---- コミット・push ----
      - name: 修正をコミットしてpush
        id: push
        if: steps.decide.outputs.run == 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "決定論的に直せる差分はありませんでした(判断を要する失敗です)"
            exit 0
          fi

          echo "--- 自動修正の差分 ---"
          git diff --stat

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q \
            -m "[ci-fix] フォーマット・生成物の自動修正" \
            -m "CI失敗のうち決定論的に修正できるものを自動適用した。実行内容: prettier / OpenAPI生成型の再生成 / Spotless" \
            -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          git push origin "HEAD:$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # AUTOFIX_TOKEN(人間名義)でpushしているため、pull_requestイベントが通常どおり
      # 発火して新しいCIが自動で走る。gh workflow run による明示起動は不要
      - name: 結果をPRに通知
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "🔧 **CIの決定論的な失敗を自動修正しました**(\`[ci-fix]\` コミット)"
            echo ""
            echo "prettier / OpenAPI生成型の再生成 / Spotless のいずれかで直る失敗でした。"
            echo "修正後のCIが自動で走ります。"
          } > /tmp/ci-fix.md
          gh pr comment "$PR" --body-file /tmp/ci-fix.md

      - name: セットアップ未完了を通知
        if: steps.decide.outputs.token_missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "ℹ️ **CIの自動修正は無効です**: リポジトリSecretsに \`AUTOFIX_TOKEN\` が設定されていません。"
            echo ""
            echo "フォーマット・生成物のズレが原因の失敗であれば、ローカルで次を実行してください。"
            echo ""
            echo '```bash'
            echo "cd frontend && pnpm run format && pnpm run generate:api"
            echo "cd backend && ./gradlew spotlessApply"
            echo '```'
            echo ""
            echo "セットアップ手順は \`.claude/01_development_docs/11_cicd_design.md\` §2.7 を参照してください。"
          } > /tmp/ci-fix-setup.md
          gh pr comment "$PR" --body-file /tmp/ci-fix-setup.md
