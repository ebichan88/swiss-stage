name: AI Design Review

# 設計ドキュメント(.claude/**・schema/**・CLAUDE.md)を変更するPRで、ドキュメント間の
# 意味的な矛盾を検出する。Reviewer(実装↔コード品質)・QA(実装↔受け入れケース台帳)・
# docs-lint(機械検査可能なID整合・ファイル参照)のいずれも見ていない「設計ドキュメント同士の
# 整合性」を埋める。
#
# 非ゲート(レポートのみ・FAILでもCIは失敗しない・自動修正との連携もない)。設計判断は
# 常に人間が行う(.claude/agents/design-reviewer.md)。
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - '.claude/**'
      - 'schema/**'
      - 'CLAUDE.md'

concurrency:
  group: ai-design-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write # claude-code-actionのOIDCトークン交換(GitHub App認証)に必須

jobs:
  design-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: AI Design Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            あなたはこのリポジトリのdesign-reviewerです。
            `.claude/agents/design-reviewer.md` を読み、その指示に厳密に従ってこのPRの
            設計ドキュメント間の整合性をレビューしてください。
            差分は `gh pr diff ${{ github.event.pull_request.number }}` で取得します。

            レポートの投稿(1PRにつき1コメントを更新し続けるsticky方式):
            1. レポートを一時ファイル(例: /tmp/design-review-report.md)に書き出す
            2. `gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --paginate --jq '.[] | select(.body | startswith("<!-- swiss-stage-ai-design-review -->")) | .id'` で既存コメントを探す
            3. 見つかったら `gh api --method PATCH repos/${{ github.repository }}/issues/comments/<ID> -F body=@/tmp/design-review-report.md` で更新する
            4. 見つからなければ `gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/design-review-report.md` で新規投稿する

            レポートはPRコメントとしてのみ投稿してください。結果をメッセージ本文に出力しないでください。
            **重要**: サブエージェント(Agent / Task ツール)に委譲しないでください。
            このジョブはあなたのターンが終わると同時に終了するため、バックグラウンドで
            起動したエージェントは投稿する前に強制終了され、レポートが永久に投稿されません。
            必ずあなた自身がこのターン内で作業を完了し、投稿まで終えてください。
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "Task,Agent"
