name: AI Plan Review

# Plan PR(.claude/07_plans/**・.claude/06_adr/**)を対象に、計画そのものの抜け
# (異常系・境界・4状態・受け入れケースの過不足)を検出する。design-reviewer(設計ドキュメント
# 同士の矛盾)・QA(実装↔受け入れケース台帳)・docs-lint(機械検査可能なヘッダ・命名規約)の
# いずれも見ていない「計画の中身が実装前に必要な水準を満たしているか」を埋める。
#
# 非ゲート(レポートのみ・FAILでもCIは失敗しない・自動修正との連携もない)。何を作るかの
# 決定は常に人間が行う(.claude/agents/plan-reviewer.md)。
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - '.claude/07_plans/**'
      - '.claude/06_adr/**'

concurrency:
  group: ai-plan-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write # claude-code-actionのOIDCトークン交換(GitHub App認証)に必須

jobs:
  plan-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: AI Plan Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude,github-actions"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            あなたはこのリポジトリのplan-reviewerです。
            `.claude/agents/plan-reviewer.md` を読み、その指示に厳密に従ってこのPRの
            実装計画(.claude/07_plans/**)・ADR(.claude/06_adr/**)の抜けをレビューして
            ください。差分は `gh pr diff ${{ github.event.pull_request.number }}` で取得します。

            レポートの投稿(1PRにつき1コメントを更新し続けるsticky方式):
            1. レポートを一時ファイル(例: /tmp/plan-review-report.md)に書き出す
            2. `gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --paginate --jq '.[] | select(.body | startswith("<!-- swiss-stage-ai-plan-review -->")) | .id'` で既存コメントを探す
            3. 見つかったら `gh api --method PATCH repos/${{ github.repository }}/issues/comments/<ID> -F body=@/tmp/plan-review-report.md` で更新する
            4. 見つからなければ `gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/plan-review-report.md` で新規投稿する

            レポートはPRコメントとしてのみ投稿してください。結果をメッセージ本文に出力しないでください。
            **重要**: サブエージェント(Agent / Task ツール)に委譲しないでください。
            このジョブはあなたのターンが終わると同時に終了するため、バックグラウンドで
            起動したエージェントは投稿する前に強制終了され、レポートが永久に投稿されません。
            必ずあなた自身がこのターン内で作業を完了し、投稿まで終えてください。
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "Task,Agent"
