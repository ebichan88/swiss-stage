# Visual Regression Test(Storybookページのスクリーンショット比較。09_test_strategy.md)。
#
# UIに関わる変更を含むPRで自動実行する(pathsフィルタで絞る)。
# **非ブロッキング**で運用する: toHaveScreenshot が maxDiffPixelRatio: 0(ピクセル完全一致)
# と厳しいため、数PR分の安定実績を見てから required check への昇格を検討する
# (11_cicd_design.md §2.8)。
# ベースライン更新は workflow_dispatch のみ(PRトリガーでは絶対に更新しない)。
name: VRT
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - 'frontend/src/**'
      - 'frontend/.storybook/**'
      - 'frontend/tests/vrt/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/playwright-vrt.config.ts'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'ベースライン画像を更新する(意図した変更のときのみtrueにする)'
        type: boolean
        default: false

concurrency:
  group: vrt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # checkoutの読み取りのみ。push権限はGITHUB_TOKENに持たせず、Commitステップで
                 # AUTOFIX_TOKEN(人間名義PAT)をpush時だけリモートURLに埋め込んで使う(下記参照)

jobs:
  vrt:
    # draft PRでは走らせない(重いため)
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # @playwright/test のバージョンを上げたら、このタグも合わせて上げること(frontend/scripts/vrt.shと同じ)
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    outputs:
      new_stories: ${{ steps.detect-new-stories.outputs.new_stories }}
    steps:
      # 書き込み権限を持つAUTOFIX_TOKENはここでは使わない。このジョブは通常のPR比較実行を含み、
      # 直後に `pnpm install` でPRの package.json/pnpm-lock.yaml を、Playwrightで
      # PR変更後のフロントエンドコードを実行する(=信頼境界の低い処理)。書き込みPATを
      # チェックアウト時点から持たせると、依存関係経由のコード実行(postinstall等)で
      # 窃取された場合にリポジトリへの書き込み権限が露出する。pushが必要な経路
      # (workflow_dispatch && update_snapshots)でも、資格情報は「Commit updated baselines」
      # ステップでpush直前にだけ与える
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          # actions/checkoutはデフォルトでGITHUB_TOKEN用の認証情報をgit設定
          # (http.extraheader)に永続化する。これを残したまま「Commit updated
          # baselines」でgit remote set-urlによりAUTOFIX_TOKENへ切り替えても、
          # extraheaderの認証情報が優先されてしまいpushがGITHUB_TOKEN(contents:
          # read)で行われ403になる(実例: PR #157適用後に発生、AUTOFIX_TOKEN自体は
          # 有効なのにgithub-actions[bot]としてpushが拒否された)。GITHUB_TOKENの
          # 資格情報を最初から残さないことで、pushに使われる認証情報をAUTOFIX_TOKEN
          # だけに限定する。
          persist-credentials: false

      - name: AUTOFIX_TOKEN未設定を検知(ベースライン更新時のみ)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        run: |
          if [ -z "${AUTOFIX_TOKEN}" ]; then
            echo "::error::AUTOFIX_TOKEN が未設定です。GITHUB_TOKEN でのpushは後続PRチェックが action_required で" \
                 "止まる既知の問題があるため行いません。セットアップ手順は 11_cicd_design.md §2.7 を参照してください。"
            exit 1
          fi
        env:
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # ベースライン更新は workflow_dispatch でのみ許可する。
      # PRトリガーで誤って更新されると「差分を検知せず素通り」する事故になるため、
      # event_name を明示的に条件に含める(inputs.update_snapshots の真偽だけに頼らない)
      - name: Run VRT(既存ベースラインと比較)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.update_snapshots }}
        run: pnpm run test:vrt

      - name: Run VRT(ベースライン更新)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        run: pnpm exec playwright test --config=playwright-vrt.config.ts --update-snapshots

      # ベースラインが存在しない新規ストーリー(Plan PRの `.stories.tsx` 追加を含む)は、
      # toHaveScreenshot が初回実行時に必ず失敗する仕様のため、下の「Upload diff on failure」で
      # 実際のスクリーンショット(*-actual.png)がartifactに含まれる。ここではPRコメント用に
      # 「新規ストーリー(デグレではない)」を機械的に判定する。スナップショットファイル名は
      # playwright-vrt.config.ts の snapshotPathTemplate(`__screenshots__/{projectName}/{arg}.png`、
      # {arg}はstories.spec.tsが渡すストーリーID)に対応する
      - name: 新規ストーリー(ベースライン未確定)を検出
        id: detect-new-stories
        if: ${{ failure() && github.event_name == 'pull_request' }}
        # コンテナジョブでは `run:` の既定シェルが `sh`(dash)になり、プロセス置換
        # (`< <(...)`)がbash専用構文のため「Syntax error: redirection unexpected」で
        # 落ちる(実測: PR #174 run 31643300008)。明示的にbashを指定する
        shell: bash
        working-directory: frontend
        run: |
          echo "cwd: $(pwd)"
          if [ ! -f storybook-static/index.json ]; then
            echo "::warning::storybook-static/index.json が見つからないため新規ストーリー判定をスキップします"
            ls -la storybook-static/ 2>&1 || echo "storybook-static/ ディレクトリ自体が存在しません"
            echo "new_stories=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # プロセス置換(`< <(...)`)経由だと、この環境ではコマンドの標準出力を`while read`が
          # 受け取れない(構文エラーは起きないが検出0件になる。実測: PR #174 run 31705708234、
          # cwd/storybook-static/index.jsonの存在は正しいのにdetectedが常に空)。原因を切り分けにくい
          # ため、一時ファイル経由の確実な方式に置き換える
          STORY_IDS_FILE="$(mktemp)"
          node -e "
            const fs = require('fs');
            const idx = JSON.parse(fs.readFileSync('storybook-static/index.json', 'utf-8'));
            for (const e of Object.values(idx.entries)) {
              if (e.type === 'story') console.log(e.id);
            }
          " > "$STORY_IDS_FILE"
          echo "storybookストーリー数: $(wc -l < "$STORY_IDS_FILE")"

          NEW_STORIES=""
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            # desktop/mobile いずれかにベースラインが無ければ「新規」扱いにする(両プロジェクトは
            # 同じストーリーIDに対して同時に追加されるのが通常だが、片方だけ欠けている状態を
            # 見逃さないため両方チェックする)
            if [ ! -f "tests/vrt/__screenshots__/desktop/${id}.png" ] || [ ! -f "tests/vrt/__screenshots__/mobile/${id}.png" ]; then
              NEW_STORIES="${NEW_STORIES}${id}, "
            fi
          done < "$STORY_IDS_FILE"
          rm -f "$STORY_IDS_FILE"
          echo "detected: [${NEW_STORIES%, }]"
          echo "new_stories=${NEW_STORIES%, }" >> "$GITHUB_OUTPUT"

      - name: Upload diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-results
          path: frontend/test-results/
          retention-days: 7

      - name: Commit updated baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        env:
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
        run: |
          # containerジョブでの実行時にリポジトリの所有者判定(dubious ownership)で
          # ローカルconfig書き込み(`git config user.name`)が失敗することがあるため、
          # safe.directoryを明示し、identityは--globalで設定する
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/vrt/__screenshots__/
          if git diff --cached --quiet; then
            echo "ベースラインに変更はありません"
          else
            git commit -m "chore: VRTベースライン画像を更新"
            # AUTOFIX_TOKEN(人間名義のPAT)はpush直前だけリモートURLに埋め込む。GITHUB_TOKENで
            # pushすると(1)後続のpull_request実行がaction_requiredで手動承認待ちになり、
            # (2)actorがgithub-actions[bot]になりallowed_botsに弾かれてAIレビュー・QAがハード
            # 失敗する既知の問題があるため(11_cicd_design.md §2.7)。値はGitHub Actionsが
            # ログ上で自動マスクする
            git remote set-url origin "https://x-access-token:${AUTOFIX_TOKEN}@github.com/${{ github.repository }}.git"
            git push origin HEAD:${{ github.ref_name }}
          fi

  # 差分を検出したPRに、ベースライン更新の導線を案内する。
  # vrtジョブはPlaywrightコンテナ内で動きgh CLIが無いため、別ジョブに分ける。
  # 現状の弱点は「差分の検知」ではなく「更新導線が手動のworkflow_dispatch画面しかない」
  # ことなので、ここが実用上いちばん効く
  notify:
    needs: vrt
    if: ${{ failure() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # gh pr comment はリポジトリを git remote から自動判定するため、checkout していないと
      # 「fatal: not a git repository」で失敗する(vrtジョブはPlaywrightコンテナ内の別ジョブのため
      # ここではファイルを使わないが、gh CLIの実行にはリポジトリコンテキストが必要)
      - uses: actions/checkout@v4

      - name: ベースライン更新の導線をPRに案内
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEW_STORIES: ${{ needs.vrt.outputs.new_stories }}
        run: |
          {
            echo "<!-- swiss-stage-vrt -->"
            echo "## 🖼 VRTの実行結果"
            echo ""
            echo "**マージはブロックしません**が、内容を確認してください。"
            echo ""
            echo "画像は実行ログの Artifacts (\`vrt-results\`) からダウンロードできます:"
            echo "${RUN_URL}"
            echo ""
            if [ -n "$NEW_STORIES" ]; then
              echo "### 新規ストーリーの参考スクリーンショット(デグレではありません)"
              echo ""
              echo "ベースラインがまだ無い新規ストーリーです。Plan PRの \`.stories.tsx\` 追加を含みます"
              echo "(\`04_development_process.md\` §5.1): ${NEW_STORIES}"
              echo ""
              echo "Artifacts内の \`<ストーリーID>-actual.png\` がその画面の初回スクリーンショットです。"
              echo "ローカルでStorybookを起動しなくてもレビューに使えます。意図した見た目であれば、"
              echo "実装PRでベースラインを確定させてください(**必ずCI経由**で):"
              echo ""
              echo '```bash'
              echo "gh workflow run vrt.yml -f update_snapshots=true --ref ${BRANCH}"
              echo '```'
              echo ""
            fi
            echo "### 既存ストーリーとの差分だった場合"
            echo ""
            echo "意図した変更であれば、ベースライン画像を更新してください(**必ずCI経由**で。"
            echo "ローカルとCIでフォントレンダリングが異なるため):"
            echo ""
            echo '```bash'
            echo "gh workflow run vrt.yml -f update_snapshots=true --ref ${BRANCH}"
            echo '```'
            echo ""
            echo "意図しない変更であれば、UIのデグレです。実装を修正してください。"
          } > /tmp/vrt-notify.md

          # 1PRにつき1コメントを更新し続けるsticky方式
          ID=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- swiss-stage-vrt -->")) | .id' | head -1)
          if [ -n "$ID" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$ID" -F body=@/tmp/vrt-notify.md
          else
            gh pr comment "$PR" --body-file /tmp/vrt-notify.md
          fi
