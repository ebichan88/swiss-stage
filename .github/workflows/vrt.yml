# Visual Regression Test(Storybookページのスクリーンショット比較)。
# CIには載せない(重いため)。大きめのUI変更をしたときに手動実行する(09_test_strategy.md)。
name: VRT
on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'ベースライン画像を更新する(意図した変更のときのみtrueにする)'
        type: boolean
        default: false

permissions:
  contents: write # ベースライン画像の更新コミットをpushするため

jobs:
  vrt:
    runs-on: ubuntu-latest
    # @playwright/test のバージョンを上げたら、このタグも合わせて上げること(frontend/scripts/vrt.shと同じ)
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Run VRT(既存ベースラインと比較)
        if: ${{ !inputs.update_snapshots }}
        run: pnpm run test:vrt

      - name: Run VRT(ベースライン更新)
        if: ${{ inputs.update_snapshots }}
        run: pnpm exec playwright test --config=playwright-vrt.config.ts --update-snapshots

      - name: Upload diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-results
          path: frontend/test-results/
          retention-days: 7

      - name: Commit updated baselines
        if: ${{ inputs.update_snapshots }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/vrt/__screenshots__/
          if git diff --cached --quiet; then
            echo "ベースラインに変更はありません"
          else
            git commit -m "chore: VRTベースライン画像を更新"
            git push origin HEAD:${{ github.ref_name }}
          fi
