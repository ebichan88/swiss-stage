# Visual Regression Test(Storybookページのスクリーンショット比較。09_test_strategy.md)。
#
# UIに関わる変更を含むPRで自動実行する(pathsフィルタで絞る)。
# **非ブロッキング**で運用する: toHaveScreenshot が maxDiffPixelRatio: 0(ピクセル完全一致)
# と厳しいため、数PR分の安定実績を見てから required check への昇格を検討する
# (11_cicd_design.md §2.8)。
# ベースライン更新は workflow_dispatch のみ(PRトリガーでは絶対に更新しない)。
name: VRT
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - 'frontend/src/**'
      - 'frontend/.storybook/**'
      - 'frontend/tests/vrt/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/playwright-vrt.config.ts'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'ベースライン画像を更新する(意図した変更のときのみtrueにする)'
        type: boolean
        default: false

concurrency:
  group: vrt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # ベースライン画像の更新コミットをpushするため(AUTOFIX_TOKEN未設定時のフォールバック用。workflow_dispatch時のみ)
  pull-requests: write # 差分検出時にベースライン更新の導線をPRコメントで案内するため

jobs:
  vrt:
    # draft PRでは走らせない(重いため)
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # @playwright/test のバージョンを上げたら、このタグも合わせて上げること(frontend/scripts/vrt.shと同じ)
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          # AUTOFIX_TOKEN(人間名義のPAT)でpushする。GITHUB_TOKENでpushすると
          # (1) 後続のpull_request実行が action_required で手動承認待ちになり、
          # (2) actorが github-actions[bot] になるため allowed_bots に弾かれて
          # AIレビュー・QAがハード失敗する。実測で確認済み(ci.ymlのautofixジョブと同じ理由、11_cicd_design.md §2.7)
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}
          persist-credentials: true

      - name: AUTOFIX_TOKEN未設定を検知(ベースライン更新時のみ)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        run: |
          if [ -z "${AUTOFIX_TOKEN}" ]; then
            echo "::error::AUTOFIX_TOKEN が未設定です。GITHUB_TOKEN でのpushは後続PRチェックが action_required で" \
                 "止まる既知の問題があるため行いません。セットアップ手順は 11_cicd_design.md §2.7 を参照してください。"
            exit 1
          fi
        env:
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # ベースライン更新は workflow_dispatch でのみ許可する。
      # PRトリガーで誤って更新されると「差分を検知せず素通り」する事故になるため、
      # event_name を明示的に条件に含める(inputs.update_snapshots の真偽だけに頼らない)
      - name: Run VRT(既存ベースラインと比較)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.update_snapshots }}
        run: pnpm run test:vrt

      - name: Run VRT(ベースライン更新)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        run: pnpm exec playwright test --config=playwright-vrt.config.ts --update-snapshots

      - name: Upload diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-results
          path: frontend/test-results/
          retention-days: 7

      - name: Commit updated baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        run: |
          # containerジョブでの実行時にリポジトリの所有者判定(dubious ownership)で
          # ローカルconfig書き込み(`git config user.name`)が失敗することがあるため、
          # safe.directoryを明示し、identityは--globalで設定する
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/vrt/__screenshots__/
          if git diff --cached --quiet; then
            echo "ベースラインに変更はありません"
          else
            git commit -m "chore: VRTベースライン画像を更新"
            # checkoutでAUTOFIX_TOKEN(persist-credentials)を使っているため、この push で
            # pull_requestイベントが通常どおり発火し、明示的なCI再起動(承認)は不要になる
            git push origin HEAD:${{ github.ref_name }}
          fi

  # 差分を検出したPRに、ベースライン更新の導線を案内する。
  # vrtジョブはPlaywrightコンテナ内で動きgh CLIが無いため、別ジョブに分ける。
  # 現状の弱点は「差分の検知」ではなく「更新導線が手動のworkflow_dispatch画面しかない」
  # ことなので、ここが実用上いちばん効く
  notify:
    needs: vrt
    if: ${{ failure() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # gh pr comment はリポジトリを git remote から自動判定するため、checkout していないと
      # 「fatal: not a git repository」で失敗する(vrtジョブはPlaywrightコンテナ内の別ジョブのため
      # ここではファイルを使わないが、gh CLIの実行にはリポジトリコンテキストが必要)
      - uses: actions/checkout@v4

      - name: ベースライン更新の導線をPRに案内
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "<!-- swiss-stage-vrt -->"
            echo "## 🖼 VRTで画面の差分を検出しました"
            echo ""
            echo "**マージはブロックしません**が、意図した変更かどうか確認してください。"
            echo ""
            echo "差分画像は実行ログの Artifacts (\`vrt-results\`) からダウンロードできます:"
            echo "${RUN_URL}"
            echo ""
            echo "### 意図した変更だった場合"
            echo ""
            echo "ベースライン画像を更新してください(**必ずCI経由**で。ローカルとCIでフォントレンダリングが異なるため):"
            echo ""
            echo '```bash'
            echo "gh workflow run vrt.yml -f update_snapshots=true --ref ${BRANCH}"
            echo '```'
            echo ""
            echo "### 意図しない変更だった場合"
            echo ""
            echo "UIのデグレです。実装を修正してください。"
          } > /tmp/vrt-notify.md

          # 1PRにつき1コメントを更新し続けるsticky方式
          ID=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- swiss-stage-vrt -->")) | .id' | head -1)
          if [ -n "$ID" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$ID" -F body=@/tmp/vrt-notify.md
          else
            gh pr comment "$PR" --body-file /tmp/vrt-notify.md
          fi
